<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Designer Kid — learn UI/UX design, build real projects and prepare for your design career. Learn. Design. Build. Grow." />
    <meta name="theme-color" content="#F5F4EF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0D0E13" media="(prefers-color-scheme: dark)" />
    <title>Designer Kid — Learn. Design. Build. Grow.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" />
    <script>
      // Apply the saved colour mode before first paint to avoid a flash.
      try {
        var m = localStorage.getItem('dk.colorMode')
        var dark = m === 'dark' || ((!m || m === 'system') && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.mode = dark ? 'dark' : 'light'
        if (dark) document.documentElement.style.cssText = '--c-bg:#0D0E13;--c-surface:#171820;--c-text:#F1F1F4;--c-primary:#9D94FF;--c-on-primary:#0d0e13'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Designer Kid needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
